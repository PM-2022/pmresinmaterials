# If Netlify "base directory" is `website`, this file applies.
# If base is the repo root, use ../netlify.toml (publish = website, functions = website/netlify/functions).

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/resin_rawmaterials_tn.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
